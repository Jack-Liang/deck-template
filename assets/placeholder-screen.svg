<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="整页占位截图">
  <!-- Placeholder for .slide-screen (the screenshot IS the slide). Replace
       with a real screenshot or a looping screen recording; keep ~16:9 so the
       figure stays height-bound. -->
  <rect width="1280" height="720" fill="#081923"/>

  <!-- title bar: traffic dots + tabs -->
  <rect width="1280" height="44" fill="#0d2431"/>
  <circle cx="24" cy="22" r="6" fill="#f03c2e"/>
  <circle cx="46" cy="22" r="6" fill="#a34865"/>
  <circle cx="68" cy="22" r="6" fill="#5f8ca4"/>
  <rect x="100" y="10" width="150" height="24" rx="6" fill="rgba(255,255,255,0.08)"/>
  <rect x="118" y="19" width="90" height="6" rx="3" fill="#79b8d1"/>
  <rect x="262" y="10" width="130" height="24" rx="6" fill="rgba(255,255,255,0.04)"/>
  <rect x="280" y="19" width="70" height="6" rx="3" fill="#7f98a7" opacity="0.6"/>

  <!-- sidebar -->
  <rect x="0" y="44" width="220" height="676" fill="#0a1e29"/>
  <rect x="28" y="84" width="120" height="12" rx="4" fill="#d58bd2" opacity="0.8"/>
  <rect x="28" y="124" width="160" height="8" rx="4" fill="#7f98a7" opacity="0.5"/>
  <rect x="28" y="150" width="140" height="8" rx="4" fill="#7f98a7" opacity="0.35"/>
  <rect x="28" y="176" width="150" height="8" rx="4" fill="#7f98a7" opacity="0.35"/>
  <rect x="28" y="202" width="120" height="8" rx="4" fill="#7f98a7" opacity="0.35"/>
  <rect x="28" y="260" width="110" height="12" rx="4" fill="#79b8d1" opacity="0.8"/>
  <rect x="28" y="300" width="150" height="8" rx="4" fill="#7f98a7" opacity="0.35"/>
  <rect x="28" y="326" width="130" height="8" rx="4" fill="#7f98a7" opacity="0.35"/>

  <!-- code lines: token colours from js/highlight.js -->
  <g>
    <text x="270" y="102" fill="#7f98a7" font-family="Cascadia Mono, Consolas, monospace" font-size="15">01</text>
    <rect x="310" y="90" width="200" height="9" rx="4" fill="#7f98a7" opacity="0.55"/>

    <text x="270" y="136" fill="#7f98a7" font-family="Cascadia Mono, Consolas, monospace" font-size="15" opacity="0.5">02</text>
    <rect x="310" y="124" width="90" height="9" rx="4" fill="#d58bd2"/>
    <rect x="410" y="124" width="260" height="9" rx="4" fill="#79b8d1"/>

    <text x="270" y="170" fill="#7f98a7" font-family="Cascadia Mono, Consolas, monospace" font-size="15" opacity="0.5">03</text>
    <rect x="330" y="158" width="180" height="9" rx="4" fill="#7fcfa0"/>

    <text x="270" y="204" fill="#7f98a7" font-family="Cascadia Mono, Consolas, monospace" font-size="15" opacity="0.5">04</text>
    <rect x="310" y="192" width="120" height="9" rx="4" fill="#d58bd2"/>
    <rect x="440" y="192" width="80" height="9" rx="4" fill="#ffad7e"/>
    <rect x="530" y="192" width="200" height="9" rx="4" fill="#79b8d1"/>

    <text x="270" y="238" fill="#7f98a7" font-family="Cascadia Mono, Consolas, monospace" font-size="15" opacity="0.5">05</text>
    <rect x="330" y="226" width="150" height="9" rx="4" fill="#7fcfa0"/>
    <rect x="490" y="226" width="60" height="9" rx="4" fill="#ffad7e"/>

    <text x="270" y="272" fill="#7f98a7" font-family="Cascadia Mono, Consolas, monospace" font-size="15" opacity="0.5">06</text>
    <rect x="310" y="260" width="70" height="9" rx="4" fill="#6d8795"/>
    <rect x="390" y="260" width="320" height="9" rx="4" fill="#7f98a7" opacity="0.45"/>

    <text x="270" y="306" fill="#7f98a7" font-family="Cascadia Mono, Consolas, monospace" font-size="15" opacity="0.5">07</text>
    <rect x="310" y="294" width="100" height="9" rx="4" fill="#d58bd2"/>
    <rect x="410" y="294" width="240" height="9" rx="4" fill="#79b8d1"/>

    <text x="270" y="340" fill="#7f98a7" font-family="Cascadia Mono, Consolas, monospace" font-size="15" opacity="0.5">08</text>
    <rect x="330" y="328" width="200" height="9" rx="4" fill="#7fcfa0"/>
  </g>

  <!-- terminal strip -->
  <rect x="270" y="400" width="960" height="270" rx="12" fill="#050f16" stroke="rgba(255,255,255,0.06)"/>
  <rect x="298" y="432" width="60" height="10" rx="4" fill="#7fcfa0"/>
  <rect x="370" y="432" width="300" height="10" rx="4" fill="#a9bdc8" opacity="0.6"/>
  <rect x="298" y="466" width="380" height="10" rx="4" fill="#a9bdc8" opacity="0.4"/>
  <rect x="298" y="500" width="46" height="10" rx="4" fill="#7fcfa0"/>
  <rect x="356" y="500" width="220" height="10" rx="4" fill="#a9bdc8" opacity="0.6"/>
  <rect x="298" y="534" width="20" height="14" rx="3" fill="#7fcfa0" opacity="0.9"/>
</svg>
